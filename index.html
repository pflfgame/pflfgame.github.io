				return (digitArray.indexOf(digit)!==-1)
			}
			if(tag==="Single-digit lover") {
				if(tagMatch.indexOf("Two-digit enthusiast")!==-1) return false
				if(tagMatch.indexOf("79^2??")!==-1) return false
				if(tagMatch.indexOf("Single-digit enthusiast")!==-1) return false
				return (num.toString().match("1")!==null && num.toString().match("4")!==null)
			}
			if(tag==="Units place") {
				if(num<10) return false
				return (num%10===1 || num%10===4 || num%10===6 || num%10===9)
			}
			if(tag==="2-claim") {
				if(num<100) return
				if(tagMatch.indexOf("8-slice")!==-1) return false
				if(tagMatch.indexOf("7-slice")!==-1) return false
				if(tagMatch.indexOf("Two-digit enthusiast")!==-1) return false
				if(tagMatch.indexOf("79^2?")!==-1) return false
				let str=num.toString()
				for(let i=0;i<str.length-1;i++) if(str[i]!=="0" && isPFLF(parseInt(str.slice(i,i+2)))) return true
				return false
			}
			if(tag==="Used") {
				if(tagMatch.indexOf("8-slice")!==-1) return false
				if(tagMatch.indexOf("Large sum")!==-1) return false
				return (num>=10000000 && num.toString().match("0")===null)
			}
			if(tag==="Empty") {
				if(tagMatch.indexOf("No dice")!==-1) return false
				return (num.toString().match("0")!==null)
			}
			if(tag==="2-slice") {
				if(tagMatch.indexOf("8-slice")!==-1) return false
				if(tagMatch.indexOf("7-slice")!==-1) return false
				if(tagMatch.indexOf("Two-digit enthusiast")!==-1) return false
				if(tagMatch.indexOf("6-slice")!==-1) return false
				if(tagMatch.indexOf("5-slice")!==-1) return false
				if(tagMatch.indexOf("79^2?")!==-1) return false
				if(tagMatch.indexOf("79^2??")!==-1) return false
				if(tagMatch.indexOf("4-slice")!==-1) return false
				if(tagMatch.indexOf("3-slice")!==-1) return false
				let str=num.toString()
				for(let i=0;i<L7-1;i++) if(str.match(STR7.slice(i,i+2))!==null) return true
				return false
			}
			if(tag==="Twice thrice") {
				if(tagMatch.indexOf("Multiple of PFLF")!==-1) return false
				if(tagMatch.indexOf("Multiple of 266")!==-1) return false
				return (num%2===0 || num%3===0)
			}
		}

		function PFLFrng(num) {
			let seed=roll(1,99999999),totalScore=0
			if(num && num<1e8) seed=num
			document.getElementById("PFLFrng-btn").innerHTML=seed
			document.getElementById("PFLFrng-tags").innerHTML=""
			tagMatch=new Array()
			if(dedulp) {
				for(let i=0;i<TagList.length;i++) if(PFLFtag(seed,TagList[i].name)) {
					for(let j=i+1;j<TagList.length;j++) if(!dedulpArray[i][j]) {
						tagMatch.push(TagList[i].name)
						if(!PFLFtag(seed,TagList[j].name)) dedulpArray[i][j]=true
						tagMatch.pop()
					}
				}
			}
			for(let i in TagList) if(PFLFtag(seed,TagList[i].name)) {
				tagMatch.push(TagList[i].name)
				totalScore+=TagList[i].score
				document.getElementById("PFLFrng-tags").innerHTML+="<button id='PFLFrng-tag"+i+"' onclick='clickTag("+i+")' class='llmargin recbtn pointer' style='background: "+TagList[i].color+"'>"+translateText(TagList[i].name,"EN")+translateText(TagList[i].chname,"CH")+"</button>"
			}
			if(tagMatch.length===0) {
				document.getElementById("PFLFrng-tags").innerHTML=translateText("Empty...")
			}
			document.getElementById("PFLFrng-score").innerHTML=translateText("Score")+": "+totalScore
			if(dedulp) {
				for(let i=0;i<TagList.length;i++) for(let j=i+1;j<TagList.length;j++) if(!dedulpArray[i][j]) {
